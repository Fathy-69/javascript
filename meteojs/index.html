<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./asset/css/index.css">
    <script src="./asset/js/script.js"></script>
    <title>Météo App</title>
<head>
<body>
    <section class="principal"> 
        <h1>Mon Météo App</h1>
        <div class="card">
            <input type="text" id="cityInput" placeholder="Entrez une ville...">
            <button id="searchBtn">Rechercher</button>
        </div>
        <div id="weather-box"></div>
            <img src="https://openweathermap.org/img/wn/01d@2x.png" class="weather-icon" alt="Icone météo">
            <h2 class="temp">--°C </h2>
            <h3 class="city">--</h3>
        <div class="details">
            <div class="col">
                <p class="humidity">Humidité : --%</p>
            </div>
            <div class="col">
                <p class="wind">Vent : -- km/h</p>
             </div>
        </div>
    </div>  
</div>

</body>
</html>
