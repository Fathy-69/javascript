<!DOCTYPE html>
<html lang="fr">

<head>
<!-- Mis en place du cdn   -->
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <style>
.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 10px;
}

/* IMPORTANT pour Chart.js */
.container canvas {
    width: 100% !important;
    height: 300px !important;
}
</style>
</head>
<body>
<!-- Plots s’installe dans une div.-->
<div class="container">
    <canvas id="tester1"></canvas>
    <canvas id="tester2"></canvas>
    <canvas id="tester3"></canvas>
    <canvas id="tester4"></canvas>
</div>
<script  src="chart.js"></script>
</body>
</html>
